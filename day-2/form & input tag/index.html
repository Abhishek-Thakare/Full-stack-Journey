<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>
    <h1>Student Registration Form</h1>

     <form action="post">
        <div>
        <label for="usename">Enter the name:</label>
        <input type="text" name="usernam" id="username" placeholder="Enter your name">
        </div>
        <div>
            <input type="radio" name="gender" id="M" value="male">
            <label for="M">Male</label>
            <input type="radio" name="gender" id="F"
            value="female">
            <label for="F">Female</label>
        </div>
         <br>
        <div>
            <label for="Email">Email:</label>
            <input type="email" name="Email" id="Email">
        </div>
        <br>
        <div>
            <label for="Password">Password:</label>
            <input type="text" name="o" id="Password">
        </div>
        <br>
        <label for="Age">Age:</label>
        <select name="Age" id="Age">
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
        </select>
        <br>
        <label for="tel">Phone Number</label>
        <input type="text" name="p" id="no">
        <br>
        <button type="submit">Submit</button>
     </form>
</body>
</html>
